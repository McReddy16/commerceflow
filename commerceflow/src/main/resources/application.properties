spring.application.name=commerceflow API
server.port=8084

# ✅ PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/commerceflow
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root

# ✅ Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ✅ Hide models/schemas from Swagger UI
springdoc.swagger-ui.defaultModelsExpandDepth=-1

 ================================
# JWT CONFIG (IMPORTANT)
# ================================
# MUST be minimum 32 characters
jwt.secret=THIS_IS_A_SUPER_SECRET_JWT_KEY_1234567890
# 1 hour in milliseconds
jwt.expiration=3600000

